paper = "26.3.build.+"
invui = "2.5.1"
astralib = "0.8.1-SNAPSHOT"
ocular = "2.3.0"
jackson = "3.2.3"

shadow = "9.6.1"
pluginyml = "0.9.0"
run = "3.1.0"

[libraries]
