[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow"}
pluginyml = { id = "de.eldoria.plugin-yml.bukkit", version.ref = "pluginyml"}
run = { id = "xyz.jpenilla.run-paper", version.ref = "run"}